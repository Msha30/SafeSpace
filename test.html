<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Table Example</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse; /* removes double borders */
    }
    th, td {
      border: 1px solid black;
      padding: 8px;
      text-align: center;
    }
    th {
      font-weight: bold;
    }
    td:first-child {
      text-align: left; /* align text in first column to left */
    }
  </style>
</head>
<body>
  <table border="1" cellspacing="0" cellpadding="8">
  <thead>
    <tr>
      <th>header</th>
      <th>header</th>
      <th>header</th>
      <th>header</th>
      <th>header</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>
        Lorem ipsum<br>
        Lorem ipsum
      </td>
      <td>12</td>
      <td>1</td>
      <td>45</td>
      <td>5</td>
    </tr>
    <tr>
      <td>
        Lorem ipsum<br>
        Lorem ipsum
      </td>
      <td>12</td>
      <td>1</td>
      <td>45</td>
      <td>5</td>
    </tr>
  </tbody>
</table>

</body>
</html>
