<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign In</title>
	<link rel="icon" type="image/png" href="photos/pic_logo2.png">
	<link rel="stylesheet" href="GCO Login.css">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
 <div class="login">
    <div class="left">
      <div class="logos">
        <img src="icons/NU Fairview logo.svg" alt="NU Fairview Logo" class="logo-small">
        <img src="photos/nu_peers.png" alt="NU Fairview Peers Logo" class="logo-small">
      </div>
      <img src="photos/pic_logo2.png" alt="SafeSpace Logo" class="main-logo">
      <h1>Creating<br>Safe Spaces!</h1>
    </div>
    <div class="right">
      <h2>Sign In</h2>
      <form action="GCO.html" method="get">
        <div class="input-group">
          <input type="email" placeholder="Work Email" required>
        </div>
        <div class="input-group">
          <input type="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn">Log In</button>
        <div class="forgot">
          <a href="#">Forgot Password?</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
